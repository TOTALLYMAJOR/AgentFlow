name: Quality and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualify tagged release
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-qualification-${{ github.ref_name }}
          path: release/
          if-no-files-found: warn
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const evidence = JSON.parse(require('fs').readFileSync('release/release-evidence.json', 'utf8')); if (evidence.finalQualification !== true || evidence.releaseReady !== true) throw new Error('release evidence is not final and ready')"
          tarball="$(node -p "JSON.parse(require('fs').readFileSync('release/release-evidence.json', 'utf8')).artifacts.tarball")"
          source_archive="$(node -p "JSON.parse(require('fs').readFileSync('release/release-evidence.json', 'utf8')).artifacts.sourceArchive")"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "AgentFlow $GITHUB_REF_NAME" \
            --generate-notes \
            "release/$tarball" \
            "release/$source_archive" \
            release/release-manifest.json \
            release/SHA256SUMS
